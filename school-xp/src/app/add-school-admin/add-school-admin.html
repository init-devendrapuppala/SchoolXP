<main class="page-shell">
    <header class="page-header">
        <a routerLink="/setup">Back to Super Admin setup</a>
        <p class="eyebrow">Identity management</p>
        <h1>Register school admin</h1>
        <p>Invite a school administrator to manage their school workspace.</p>
    </header>

    <form class="admin-form" (ngSubmit)="submitSchoolAdmin()">
        <section class="content-card">
            <h2>Administrator details</h2>
            <div class="form-grid">
                <div>
                    <label for="firstName">First name</label>
                    <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />
                </div>
                <div>
                    <label for="lastName">Last name</label>
                    <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />
                </div>
                <div class="field--wide">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="email" required />
                </div>
            </div>
        </section>

        <div class="actions">
            <button type="button" (click)="cancel()">Cancel</button>
            <button type="submit">Send invitation</button>
        </div>
    </form>
</main>
